# main에 push되면 Quartz를 빌드해 GitHub Pages로 배포한다.
# 저장소 Settings → Pages → Source 가 "GitHub Actions" 여야 한다.
name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 페이지 수정일을 git 기록에서 읽기 위해 전체 기록 필요
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Windows에서 커밋하면 bootstrap-cli.mjs 실행 권한이 빠져 npx quartz 가 Permission denied 로 실패하므로 node 로 직접 실행
      - run: node quartz/bootstrap-cli.mjs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
